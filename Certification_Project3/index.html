<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input,
select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:20px;
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    min-height:120px;
    white-space:pre-line;
}

</style>

</head>

<body>

<div class="container">

<h1>Voting System</h1>

<h3>Add an option</h3>

<input
type="text"
id="option-input"
placeholder="Example: France">

<button onclick="addNewOption()">
Add Option
</button>

<hr style="margin:20px 0;">

<h3>Vote</h3>

<select id="option-select">

</select>

<input
type="text"
id="voter-input"
placeholder="Voter ID">

<button onclick="castVote()">
Vote
</button>

<button onclick="showResults()">
Display Results
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
